<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Text Assistant</title>

    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

    <h1>AI Text Assistant</h1>

    <p>Paste your text below and let the assistant process it.</p>

    <textarea
        id="userText"
        placeholder="Enter your text here..."
    ></textarea>

    <div>
        <button id="summarizeBtn">Summarize</button>
        <button id="keywordsBtn">Extract Keywords</button>
        <button id="wordCountBtn">Word Count</button>
    </div>

    <h2>Result</h2>

    <div id="result">
        Your result will appear here.
    </div>


    <script>

        const textArea = document.getElementById("userText");
        const result = document.getElementById("result");

        const summarizeBtn =
            document.getElementById("summarizeBtn");

        const keywordsBtn =
            document.getElementById("keywordsBtn");

        const wordCountBtn =
            document.getElementById("wordCountBtn");


        // SUMMARIZE
        summarizeBtn.addEventListener("click", function () {

            const text = textArea.value.trim();

            if (!text) {
                result.textContent =
                    "Please enter some text first.";
                return;
            }

            const sentences =
                text.split(/(?<=[.!?])\s+/);

            const summaryLength =
                Math.max(
                    1,
                    Math.ceil(sentences.length / 3)
                );

            result.textContent =
                sentences
                    .slice(0, summaryLength)
                    .join(" ");
        });


        // EXTRACT KEYWORDS
        keywordsBtn.addEventListener("click", function () {

            const text = textArea.value.trim();

            if (!text) {
                result.textContent =
                    "Please enter some text first.";
                return;
            }

            const stopWords = [
                "the", "a", "an", "and", "or",
                "but", "is", "are", "was", "were",
                "to", "of", "in", "on", "for",
                "with", "can", "this", "that"
            ];

            const words = text
                .toLowerCase()
                .replace(/[^\w\s]/g, "")
                .split(/\s+/);

            const keywords =
                [...new Set(
                    words.filter(function (word) {
                        return (
                            word.length > 4 &&
                            !stopWords.includes(word)
                        );
                    })
                )];

            result.textContent =
                "Keywords: " +
                keywords.slice(0, 10).join(", ");
        });


        // WORD COUNT
        wordCountBtn.addEventListener("click", function () {

            const text = textArea.value.trim();

            if (!text) {
                result.textContent = "Word count: 0";
                return;
            }

            const words =
                text.split(/\s+/);

            result.textContent =
                "Word count: " + words.length;
        });

    </script>

</body>
</html>
