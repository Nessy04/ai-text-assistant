<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>AI Text Assistant</h1>

    <p>Paste your text below and let AI help you process it.</p>

    <textarea
        id="userText"
        rows="10"
        cols="50"
        placeholder="Enter your text here...">
    </textarea>

    <br><br>

<button id="summarizeBtn">Summarize</button>
<button id="keywordsBtn">Extract Keywords</button>
<button id="wordCountBtn">Word Count</button>
    
    <h2>AI Result</h2>
    <div id="result">
        Your result will appear here.
    </div>
   <script>
const button = document.getElementById("summarizeBtn");
const keywordsButton = document.getElementById("keywordsBtn");
const wordCountButton = document.getElementById("wordCountBtn");
const textArea = document.getElementById("userText");
const result = document.getElementById("result");

button.addEventListener("click", function () {
    const text = textArea.value.trim();

    if (text === "") {
        result.textContent = "Please enter some text first.";
        return;
    }

    const sentences = text.split(/(?<=[.!?])\s+/);
    const summaryLength = Math.max(1, Math.ceil(sentences.length / 3));

    result.textContent = sentences.slice(0, summaryLength).join(" ");
});

keywordsButton.addEventListener("click", function () {
    const text = textArea.value.trim();

    if (text === "") {
        result.textContent = "Please enter some text first.";
        return;
    }

    const stopWords = [
        "the", "a", "an", "and", "or", "but",
        "is", "are", "was", "were", "to",
        "of", "in", "on", "for", "with", "can"
    ];

    const words = text
        .toLowerCase()
        .replace(/[^\w\s]/g, "")
        .split(/\s+/);

    const keywords = [...new Set(
        words.filter(word =>
            word.length > 4 && !stopWords.includes(word)
        )
    )];

    result.textContent = "Keywords: " + keywords.slice(0, 10).join(", ");
});

wordCountButton.addEventListener("click", function () {
    const text = textArea.value.trim();

    if (text === "") {
        result.textContent = "Word count: 0";
        return;
    }

    result.textContent = "Word count: " + text.split(/\s+/).length;
});
</script> 
   
</body>
</html>
